services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit_stock
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit_stock"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - orbit_data:/var/lib/postgresql/data

volumes:
  orbit_data:
