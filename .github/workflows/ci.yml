name: Pruebas automatizadas

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Pruebas unitarias (sin infraestructura)
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener el código
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias desde el archivo de bloqueo
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Ejecutar pruebas unitarias con Vitest
        run: npm run test:unit

  integration-tests:
    name: Integración (PostgreSQL con Testcontainers)
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener el código
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias desde el archivo de bloqueo
        run: npm ci

      - name: Ejecutar integración con PostgreSQL temporal
        run: npm run test:integration
